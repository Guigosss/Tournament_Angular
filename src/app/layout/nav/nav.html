<div class="flex h-full min-h-100 flex-col px-3 py-6">

  <p-menu [model]="items()" class="nav-menu block w-full">

    <ng-template let-item>
      <span class="px-2 text-[0.7rem] font-bold tracking-[1.5px] text-app-muted">
        {{ item.label }}
      </span>
    </ng-template>

    <ng-template #item let-item>
      <a
        [routerLink]="item.routerLink"
        routerLinkActive="active"
        class="p-menu-item-link group relative flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-app-soft no-underline transition before:absolute before:bottom-2 before:left-0 before:top-2 before:w-0.5 before:rounded-full before:bg-app-primary before:opacity-0 hover:bg-white/5 hover:text-app-text [&.active]:bg-app-primary-dark/25 [&.active]:font-semibold [&.active]:text-app-text [&.active]:before:opacity-100"
      >
        <i
          class="text-base text-app-muted transition group-hover:text-app-primary group-[.active]:text-app-primary"
          [class]="item.icon"
        ></i>
        <span>{{ item.label }}</span>
      </a>
    </ng-template>

  </p-menu>

  <div class="mt-auto flex items-center gap-3 border-t border-app-border px-2 pt-4">
    <p-avatar
      icon="pi pi-trophy"
      shape="square"
      class="shrink-0 bg-app-primary-dark/30 text-app-primary"
    />

    <div>
      <p class="text-xs font-bold tracking-wider text-app-text">TOURNAMENT APP</p>
      <p class="text-[0.7rem] text-app-muted">Version 1.0.0</p>
    </div>
  </div>

</div>
