<div class="bg-app-black">

  <div class="flex h-[72px] items-center justify-between px-4 sm:px-8">

    <!-- Brand -->
    <a
      routerLink="/home"
      class="bg-linear-to-r from-app-text via-app-text to-app-primary bg-clip-text text-2xl font-extrabold tracking-tight text-transparent no-underline transition hover:opacity-80"
    >
      Tournament
    </a>

    <!-- Account -->
    <div class="flex items-center gap-3">
      @if (authService.user(); as user) {

        <button
          pButton
          type="button"
          severity="secondary"
          class="gap-3"
          aria-haspopup="true"
          [text]="true"
          (click)="menu.toggle($event)"
        >
          <p-avatar
            [label]="initials()"
            shape="circle"
            class="bg-app-primary-dark/30 font-semibold text-app-primary"
          />
          <span class="hidden text-sm sm:inline">Bonjour, {{ user.username }}</span>
          <i class="pi pi-chevron-down text-xs"></i>
        </button>

        <p-menu #menu [model]="userMenu" [popup]="true" appendTo="body" />

      } @else {

        <a pButton routerLink="/login" severity="secondary" [outlined]="true">
          <i class="pi pi-sign-in"></i>
          <span>Connexion</span>
        </a>

        <a pButton routerLink="/register">
          <i class="pi pi-user-plus"></i>
          <span>Inscription</span>
        </a>

      }
    </div>

  </div>

  <!-- Accent line -->
  <div class="h-px bg-linear-to-r from-transparent via-app-primary/50 to-transparent"></div>

</div>
