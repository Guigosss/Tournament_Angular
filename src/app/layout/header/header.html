<header class="flex h-[75px] items-center justify-between border-b border-white/8 bg-app-black px-4 sm:px-8">

  <div class="flex items-center gap-3">
    <img
      ngSrc="assets/images/logo_tournament.png"
      alt="Tournament Logo"
      width="1536"
      height="1024"
      class="size-[45px] object-contain"
    />

    <h1 class="text-xl font-bold text-app-text">
      Tournament App
    </h1>
  </div>

  <div class="flex items-center gap-3">
    @if (authService.user(); as user) {
      <span class="text-sm text-app-text">
        Bonjour, {{ user.username }}
      </span>

      <button
        type="button"
        (click)="logout()"
        class="rounded-lg border border-white/15 px-4 py-2 text-sm text-app-text hover:border-red-500 hover:text-red-400"
      >
        Déconnexion
      </button>
    } @else {
      <a
        routerLink="/login"
        class="rounded-lg border border-white/15 px-4 py-2 text-sm text-app-text hover:border-primary hover:text-primary"
      >
        Connexion
      </a>

      <a
        routerLink="/register"
        class="rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-primary/80"
      >
        Inscription
      </a>
    }
  </div>

</header>
