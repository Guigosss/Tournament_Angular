<div class="mx-auto w-full max-w-5xl p-6">

  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-app-text">Create a tournament</h1>

    <p class="mt-2 text-app-muted">
      Set up your tournament and define its parameters.
    </p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">

    <!-- General infos -->
    <app-tournament-general-info
      [form]="form"
      [formats]="formats"
      [participantTypes]="participantTypes"
    />

    <!-- Schedule -->
    <app-tournament-schedule [form]="form" />

    <!-- Error -->
    @if (errorMessage()) {
      <div class="mb-6 rounded-xl border border-red-500/20 bg-red-500/10 p-4">
        <p class="text-sm text-red-400">
          {{ errorMessage() }}
        </p>
      </div>
    }

    <!-- Actions -->
    <div class="flex flex-col-reverse justify-end gap-3 sm:flex-row">

      <button
        pButton
        type="button"
        severity="secondary"
        [outlined]="true"
        routerLink="/tournaments"
      >
        <span>Cancel</span>
      </button>

      <button
        pButton
        type="submit"
      >
        <i class="pi pi-check"></i>
        <span>Save tournament</span>
      </button>

    </div>

  </form>

</div>
