<div class="page-container">

  <form [formGroup]="form" (ngSubmit)="submit()">

    <app-tournament-general-info
      [form]="form"
      [formats]="formats"
      [participantTypes]="participantTypes"
    />

    <app-tournament-schedule [form]="form" />

    @if (errorMessage()) {
      <p-message class="mb-6 block" severity="error">{{ errorMessage() }}</p-message>
    }

    <div class="action-bar">
      <button pButton type="button" severity="secondary" [outlined]="true" routerLink="/tournaments">
        Cancel
      </button>

      <button pButton type="submit" [disabled]="saving()">
        <i class="pi pi-check"></i>
        <span>Save tournament</span>
      </button>
    </div>

  </form>

</div>
