<div class="mx-auto w-full max-w-5xl p-6">

  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-app-text">Tournament Details</h1>
    <p class="mt-2 text-app-muted">Review the information and settings for your tournament.</p>
  </div>

  <!-- Error -->
  @if (errorMessage()) {
    <div class="mb-6 rounded-xl border border-red-500/20 bg-red-500/10 p-4">
      <p class="text-sm text-red-400">{{ errorMessage() }}</p>
    </div>
  }

  @if (tournament(); as detail) {

    <!-- General infos -->
    <app-tournament-overview [tournament]="detail.tournament" />

    <!-- Participants -->
    <app-tournament-participants
      [participantCount]="detail.participantCount"
      [maxParticipants]="detail.tournament.maxParticipants"
    />

    <!-- Calendar -->
    <app-tournament-calendar [tournament]="detail.tournament" />

    <!-- Actions -->
    <div class="flex justify-end">

      <button
        pButton
        type="button"
        (click)="editTournament()"
      >
        <i class="pi pi-pencil"></i>
        <span>Modifier le tournoi</span>
      </button>

    </div>

  }

</div>
