<div class="page-container">

  <app-tournament-list-header [stats]="tournaments() ? stats() : null" />

  @if (hasError()) {

    <p-message class="block" severity="error">Unable to load tournaments.</p-message>

  } @else if (tournaments(); as list) {

    @if (list.length === 0) {

      <app-empty-state
        icon="pi pi-trophy"
        heading="No tournaments available"
        message="There is no tournament yet. Why not create the first one?"
      >
        <button pButton type="button" class="mt-2" routerLink="/tournaments/new">
          <i class="pi pi-plus"></i>
          <span>Create a tournament</span>
        </button>
      </app-empty-state>

    } @else {

      <app-tournament-filters [(search)]="search" [(status)]="statusFilter" />

      <div class="flex flex-col gap-5">
        @for (tournament of filteredTournaments(); track tournament.id) {
          <app-tournament-card [tournament]="tournament" />
        } @empty {
          <p class="py-10 text-center text-hint">No tournament matches your filters.</p>
        }
      </div>

    }

  } @else {

    <!-- Loading -->
    <div class="flex flex-col gap-5">
      @for (item of [1, 2, 3]; track item) {
        <p-skeleton height="9rem" borderRadius="1rem" />
      }
    </div>

  }

</div>
