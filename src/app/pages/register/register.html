<div class="auth-page">

  <div class="auth-glow"></div>

  <p-card class="auth-card">

    <ng-template #header>
      <div class="accent-bar"></div>
    </ng-template>

    <!-- Title -->
    <div class="flex flex-col items-center gap-4 text-center">
      <p-avatar icon="pi pi-trophy" shape="square" size="xlarge" class="icon-badge" />

      <div>
        <h1 class="text-title">Create an account</h1>
        <p class="mt-2 text-hint">Join the competition on Tournament App</p>
      </div>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="mt-8 flex flex-col gap-5">

      <app-form-field
        label="Username"
        inputId="username"
        error="Username is required (50 characters max)."
        [control]="registerForm.controls.username"
      >
        <p-iconfield>
          <p-inputicon class="pi pi-user" />
          <input
            pInputText
            id="username"
            type="text"
            formControlName="username"
            autocomplete="username"
            placeholder="Your username"
            maxlength="50"
            class="w-full"
          />
        </p-iconfield>
      </app-form-field>

      <app-form-field
        label="Email"
        inputId="email"
        error="Please enter a valid email address."
        [control]="registerForm.controls.email"
      >
        <p-iconfield>
          <p-inputicon class="pi pi-envelope" />
          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="you@example.com"
            maxlength="254"
            class="w-full"
          />
        </p-iconfield>
      </app-form-field>

      <app-form-field
        label="Password"
        inputId="password"
        error="Password must be between 8 and 72 bytes."
        hint="At least 8 characters"
        [control]="registerForm.controls.password"
      >
        <p-iconfield>
          <p-inputicon class="pi pi-lock" />
          <input
            pInputText
            id="password"
            formControlName="password"
            autocomplete="new-password"
            placeholder="Your password"
            class="w-full"
            [type]="showPassword() ? 'text' : 'password'"
          />
          <p-inputicon
            role="button"
            class="cursor-pointer"
            [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            (click)="showPassword.set(!showPassword())"
          />
        </p-iconfield>
      </app-form-field>

      <app-form-field
        label="Confirm password"
        inputId="confirmPassword"
        error="Please confirm your password."
        [control]="registerForm.controls.confirmPassword"
      >
        <p-iconfield>
          <p-inputicon class="pi pi-lock" />
          <input
            pInputText
            id="confirmPassword"
            formControlName="confirmPassword"
            autocomplete="new-password"
            placeholder="Repeat your password"
            class="w-full"
            [type]="showPassword() ? 'text' : 'password'"
          />
        </p-iconfield>

        @if (showMismatch()) {
          <p-message severity="error" size="small" variant="simple">Passwords do not match.</p-message>
        }
      </app-form-field>

      @if (errorMessage()) {
        <p-message severity="error">{{ errorMessage() }}</p-message>
      }

      <button pButton type="submit" class="w-full" [disabled]="loading()">
        <i class="pi pi-user-plus"></i>
        <span>{{ loading() ? 'Creating account...' : 'Create account' }}</span>
      </button>

    </form>

    <p-divider align="center">
      <span class="text-xs text-app-muted">Already have an account?</span>
    </p-divider>

    <a pButton routerLink="/login" severity="secondary" class="w-full" [outlined]="true">
      <i class="pi pi-sign-in"></i>
      <span>Sign in</span>
    </a>

  </p-card>

</div>
