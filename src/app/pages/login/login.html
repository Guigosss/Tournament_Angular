<div class="auth-page">

  <div class="auth-glow"></div>

  <p-card class="auth-card">

    <ng-template #header>
      <div class="accent-bar"></div>
    </ng-template>

    <!-- Title -->
    <div class="flex flex-col items-center gap-4 text-center">
      <p-avatar icon="pi pi-trophy" shape="square" size="xlarge" class="icon-badge" />

      <div>
        <h1 class="text-title">Welcome back!</h1>
        <p class="mt-2 text-hint">Sign in to your Tournament App account</p>
      </div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-8 flex flex-col gap-5">

      <app-form-field
        label="Username"
        inputId="username"
        error="Username is required."
        [control]="loginForm.controls.username"
      >
        <p-iconfield>
          <p-inputicon class="pi pi-user" />
          <input
            pInputText
            id="username"
            type="text"
            formControlName="username"
            autocomplete="username"
            placeholder="Your username"
            class="w-full"
          />
        </p-iconfield>
      </app-form-field>

      <app-form-field
        label="Password"
        inputId="password"
        error="Password is required."
        [control]="loginForm.controls.password"
      >
        <p-iconfield>
          <p-inputicon class="pi pi-lock" />
          <input
            pInputText
            id="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Your password"
            class="w-full"
            [type]="showPassword() ? 'text' : 'password'"
          />
          <p-inputicon
            role="button"
            class="cursor-pointer"
            [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            (click)="showPassword.set(!showPassword())"
          />
        </p-iconfield>
      </app-form-field>

      @if (errorMessage()) {
        <p-message severity="error">{{ errorMessage() }}</p-message>
      }

      <button pButton type="submit" class="w-full" [disabled]="loading()">
        <i class="pi pi-sign-in"></i>
        <span>{{ loading() ? 'Signing in...' : 'Sign in' }}</span>
      </button>

    </form>

    <p-divider align="center">
      <span class="text-xs text-app-muted">Don't have an account yet?</span>
    </p-divider>

    <a pButton routerLink="/register" severity="secondary" class="w-full" [outlined]="true">
      <i class="pi pi-user-plus"></i>
      <span>Create an account</span>
    </a>

  </p-card>

</div>
