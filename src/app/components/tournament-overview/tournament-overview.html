<section class="mb-6 rounded-2xl border border-white/10 bg-[#211A29] p-6">

  <!-- Header -->
  <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <div>
      <h2 class="text-2xl font-bold text-app-text">{{ tournament().name }}</h2>
      <p class="mt-2 text-sm text-app-muted">General tournament information</p>
    </div>

    <span class="w-fit rounded-full border border-[#a83bd8]/30 bg-[#7020A0]/20 px-4 py-2 text-xs font-semibold text-[#c45cf5]">{{ tournament().status }}</span>
  </div>

  <!-- Description -->
  <div class="border-t border-white/10 pt-6">
    <h3 class="mb-3 text-sm font-semibold text-[#c45cf5]">Description</h3>
    <p class="text-sm leading-relaxed text-app-soft">{{ tournament().description || 'No description available.' }}</p>
  </div>

  <!-- Tournament details -->
  <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">

    <!-- Tournament format -->
    <div class="rounded-xl border border-white/10 bg-[#17131D] p-4">
      <div class="mb-2 flex items-center gap-2">
        <i class="pi pi-sitemap text-[#c45cf5]"></i>

        <p class="text-sm text-app-muted">Tournament format</p>
      </div>

      <p class="font-semibold text-app-text">{{ tournament().format }}</p>
    </div>

    <!-- Participant type -->
    <div class="rounded-xl border border-white/10 bg-[#17131D] p-4">
      <div class="mb-2 flex items-center gap-2">
        <i class="pi pi-users text-[#c45cf5]"></i>

        <p class="text-sm text-app-muted">Participant type</p>
      </div>

      <p class="font-semibold text-app-text">{{ tournament().participantType }}</p>
    </div>

  </div>

</section>
