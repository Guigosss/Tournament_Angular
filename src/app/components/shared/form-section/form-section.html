<p-card>

  <div class="flex items-center gap-4">
    <p-avatar [icon]="icon()" shape="square" size="large" class="icon-badge shrink-0" />

    <div>
      <h2 class="text-heading">{{ heading() }}</h2>

      @if (subheading()) {
        <p class="mt-1 text-hint">{{ subheading() }}</p>
      }
    </div>
  </div>

  <p-divider />

  <div class="flex flex-col gap-6">
    <ng-content />
  </div>

</p-card>
