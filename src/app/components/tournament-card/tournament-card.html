<p-card class="tournament-card">

  <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">

    <!-- Tournament infos -->
    <div class="min-w-0 flex-1">

      <h2 class="mb-3 text-xl font-semibold text-app-text">{{ tournament().name }}</h2>

      <p class="mb-5 text-sm leading-relaxed text-app-muted">{{ tournament().description }}</p>

      <!-- Additional infos-->
      <div class="flex flex-wrap items-center gap-3">
        <span class="rounded-full border border-[#a83bd8]/30 bg-[#7020A0]/20 px-3 py-1 text-xs font-medium text-[#c45cf5]">{{ tournament().status }}</span>
        <span class="rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs font-medium text-app-soft">{{ tournament().format }}</span>
      </div>

    </div>

    <div class="shrink-0">
      <button
        pButton
        type="button"
        severity="secondary"
        [outlined]="true"
        [routerLink]="['/tournaments', tournament().id]"
      >
        <span>View the tournament</span>
        <i class="pi pi-arrow-right"></i>
      </button>
    </div>

  </div>

</p-card>
