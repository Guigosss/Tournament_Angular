<section
  [formGroup]="form()"
  class="mb-6 rounded-2xl border border-white/10 bg-[#211A29] p-6"
>

  <div class="mb-6">
    <h2 class="text-xl font-semibold text-app-text">Tournament schedule</h2>
    <p class="mt-1 text-sm text-app-muted">Define the registration periods and the tournament dates.</p>
  </div>

  <!-- Registrations -->
  <div class="mb-6">

    <h3 class="mb-4 text-sm font-semibold text-[#c45cf5]">Registration period</h3>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">

      <div>
        <label for="registrationStartDate" class="mb-2 block text-sm font-medium text-app-soft">Registration opens</label>
        <input
          type="datetime-local"
          id="registrationStartDate"
          formControlName="registrationStartDate"
          class="w-full rounded-xl border border-white/10 bg-[#17131D] px-4 py-3 text-app-text outline-none transition focus:border-[#a83bd8]"
        />
      </div>

      <div>
        <label for="registrationEndDate" class="mb-2 block text-sm font-medium text-app-soft">Registration closed</label>
        <input
          type="datetime-local"
          id="registrationEndDate"
          formControlName="registrationEndDate"
          class="w-full rounded-xl border border-white/10 bg-[#17131D] px-4 py-3 text-app-text outline-none transition focus:border-[#a83bd8]"
        />
      </div>

    </div>

  </div>

  <!-- Progression -->
  <div class="border-t border-white/10 pt-6">

    <h3 class="mb-4 text-sm font-semibold text-[#c45cf5]">Tournament progression</h3>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">

      <div>
        <label for="startDate" class="mb-2 block text-sm font-medium text-app-soft">Start of the tournament</label>
        <input
          type="datetime-local"
          id="startDate"
          formControlName="startDate"
          class="w-full rounded-xl border border-white/10 bg-[#17131D] px-4 py-3 text-app-text outline-none transition focus:border-[#a83bd8]"
        />
      </div>

      <div>
        <label for="endDate" class="mb-2 block text-sm font-medium text-app-soft">End of the tournament</label>
        <input
          type="datetime-local"
          id="endDate"
          formControlName="endDate"
          class="w-full rounded-xl border border-white/10 bg-[#17131D] px-4 py-3 text-app-text outline-none transition focus:border-[#a83bd8]"
        />
      </div>

    </div>

  </div>

</section>
