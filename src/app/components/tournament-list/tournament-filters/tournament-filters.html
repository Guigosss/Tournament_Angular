<p-iconfield class="flex-1">
  <p-inputicon class="pi pi-search" />
  <input
    pInputText
    class="w-full"
    placeholder="Search a tournament..."
    [(ngModel)]="search"
  />
</p-iconfield>

<p-select
  class="sm:w-56"
  placeholder="All statuses"
  optionLabel="label"
  optionValue="value"
  [options]="statusOptions"
  [showClear]="true"
  [(ngModel)]="status"
/>
