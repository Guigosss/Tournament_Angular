<header class="page-header">

  <div>
    <h1 class="text-title">Tournaments</h1>

    @if (stats(); as items) {
      <p class="mt-1 text-hint">
        @for (stat of items; track stat.label; let last = $last) {
          <span><span class="font-medium text-app-soft">{{ stat.value }}</span> {{ stat.label | lowercase }}</span>
          @if (!last) {
            <span> · </span>
          }
        }
      </p>
    }
  </div>

  <button pButton type="button" routerLink="/tournaments/new">
    <i class="pi pi-plus"></i>
    <span>Create a tournament</span>
  </button>

</header>
